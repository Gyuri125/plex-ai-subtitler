services:
  plex-subtitler:
    build: .
    container_name: plex-ai-subtitler
    restart: unless-stopped
    volumes:
      # Csatold a film- es sorozatkonyvtarakat:
      - /path/to/your/media:/media:rw
      - ./settings.json:/app/settings.json:rw
      - ./logs:/app/logs:rw
    environment:
      - TZ=Europe/Budapest
      - PYTHONUNBUFFERED=1
